<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探索试验场 · 2D 平台原型</title>
  <script>
  // ================= 手感参数：修改后保存文件，刷新浏览器即可 =================
  // 距离单位为像素，时间单位为秒；速度为 像素/秒，加速度为 像素/秒²。
  const CONFIG = {
    moveSpeed: 300,             // 左右移动的最高速度
    acceleration: 2400,        // 按住方向键时的加速度；越大越快达到最高速度
    deceleration: 3000,        // 松开方向键时的减速度；越大越快停下
    airControl: 0.8,           // 空中加减速相对地面的倍率；越小空中越难转向

    gravity: 1750,             // 上升时的重力；越大越快结束上升
    fallGravityMultiplier: 1.35, // 下落重力倍率；大于 1 让落地更干脆
    jumpSpeed: 630,            // 起跳时向上的初速度；越大跳得越高
    doubleJumpMultiplier: 1,   // 解锁后的二段跳力度，相对普通起跳的倍率
    jumpReleaseMultiplier: 0.45, // 提前松开空格时保留的上升速度比例（0～1）
    maxFallSpeed: 900,         // 最大下落速度，避免坠落越来越快
    coyoteTime: 0.1,           // 土狼时间：走出平台后仍能起跳的秒数
    jumpBufferTime: 0.1,       // 跳跃缓冲：提前按跳可等待落地的秒数

    dashSpeed: 880,            // 冲刺时的水平速度
    dashDuration: 0.15,        // 一次冲刺持续的秒数；期间暂停重力
    dashCooldown: 0.65,        // 从冲刺开始到下一次可冲刺的秒数
    dashExitSpeed: 300,        // 冲刺结束时保留的水平速度，随后正常加减速

    cameraFollow: 8,           // 摄像机追随强度；越大越紧，越小越柔和
    cameraLookAhead: 90,       // 摄像机沿朝向提前看的距离；设为 0 则居中跟随

    // 战斗：J 每按一次挥砍一次，移动与空中均可攻击。
    playerHealth: 5,           // 玩家生命格数；存档、复活时回满
    contactDamage: 1,          // 敌人碰撞和 Boss 招式每次造成的伤害
    attackDamage: 1,           // 每次挥砍的伤害
    attackRange: 64,           // 从玩家前方延伸的攻击距离
    attackHeight: 44,          // 近战判定的高度
    attackDuration: 0.14,      // 挥砍判定和线条效果持续时间
    attackCooldown: 0.3,       // 两次攻击之间的最短间隔
    hitStop: 0.05,             // 命中后双方暂停的时间
    hitFlash: 0.12,            // 敌人受击闪白时间
    shakeDuration: 0.15,       // 命中震屏持续时间
    shakeStrength: 3,          // 命中震屏最大幅度；设为 0 可关闭
    hurtInvulnerability: 1,    // 玩家受伤后的无敌时间
    hurtStun: 0.2,             // 玩家被弹开时暂时失去控制的时间
    hurtKnockbackX: 350,       // 玩家受伤时的水平弹开速度
    hurtKnockbackY: 210,       // 玩家受伤时向上弹起的速度
    enemyHealth: 3,            // 普通敌人血量；默认需要命中 3 次
    critterHealth: 2,          // R1 巡游小甲需要命中 2 次
    enemySpeed: 65,            // 普通敌人巡逻速度
    enemyKnockback: 250,       // 普通敌人被击退的水平速度
    enemyKnockbackFriction: 1200, // 击退后的减速；越小退得越远
    enemyKnockbackY: 130,      // 普通敌人被击退时向上的速度
    enemyStun: 0.24,           // 普通敌人受击后暂停巡逻的时间
    actionEffectLifetime: 0.28, // 动作粒子淡出的时间
    landingEffectSpeed: 150,   // 低于此下落速度的接地不产生粒子

    // 第一章食腐甲：只影响 kind=scavenger 的短遭遇，橙色蓄力后直线近扑。
    scavengerWindup: 0.55,     // 近扑前摇，朝向在前摇开始时锁定
    scavengerLunge: 0.28,      // 近扑持续时间
    scavengerSpeed: 290,       // 近扑速度，像素/秒
    scavengerRecovery: 0.85,   // 扑空后的反击窗口
    scavengerReach: 210,       // 同层目标进入此距离时开始蓄力
    scavengerRetreatSpeed: 140, // 被逼退后返回聚食处的速度，不再伤人

    guardHealth: 6,            // 第二章负壳守卫扣带被击中六次后停战
    guardClawWindup: 0.65,     // 钳击前摇，开始时锁定朝向
    guardPressWindup: 0.9,     // 重壳前压前摇
    guardClawDuration: 0.22,   // 钳击有效时间
    guardPressDuration: 0.34,  // 重壳前压时间
    guardPressSpeed: 300,      // 重壳前压速度，像素/秒
    guardRecovery: 1.05,       // 收招露出扣带，可正面反击
    guardAttackRange: 105,     // 钳击向前伸出的距离

    sludgeHealth: 5,           // 第三章大甲有效命中五次后退回低坑
    sludgeChaseSpeed: 160,     // 大甲追向持灯者的速度，玩家可引离巢槽
    sludgeWindup: 0.7,        // 近扑前摇，开始时锁定朝向
    sludgeLungeSpeed: 260,     // 近扑速度
    sludgeLungeDuration: 0.28, // 近扑持续时间
    sludgeRecovery: 1.1,       // 收招抬甲露出腹侧的时间

    // Boss：三招依次循环，橙色是前摇，红色是生效中的攻击。
    bossHealth: 16,            // Boss 血量
    bossSweepWindup: 0.65,     // 近身横扫的前摇时间
    bossChargeWindup: 0.85,    // 冲撞的前摇时间
    bossSlamWindup: 0.95,      // 震地的前摇时间
    bossSweepDuration: 0.18,   // 横扫有效时间
    bossChargeDuration: 0.38,  // 冲撞持续时间
    bossSlamDuration: 0.18,    // 震地动作持续时间
    bossRecovery: 0.75,        // 出招后的硬直时间，也是反击机会
    bossSweepRange: 110,      // 横扫向前延伸的范围
    bossChargeSpeed: 620,     // 冲撞速度
    bossWaveSpeed: 320,       // 贴地震波速度
    bossWaveLifetime: 1.3,    // 贴地震波存在时间
  };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #171b22; color: #e7e9ed; }
    body { font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    main { width: min(1120px, calc(100% - 32px)); margin: 24px auto; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { margin-bottom: 12px; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; }
    .sub { color: #a2abb9; font-size: 12px; margin-left: 12px; }
    button { background: #303846; border: 1px solid #566173; color: #e7e9ed; padding: 5px 12px; cursor: pointer; font: inherit; }
    button:hover { background: #404a5a; }
    button:focus-visible { outline: 2px solid #b8dce6; outline-offset: 3px; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #242a34; image-rendering: pixelated; }
    canvas:focus { outline: none; }
    canvas:focus-visible { outline: 2px solid #b8dce6; }
    canvas:fullscreen { width: 100vw; height: 100vh; object-fit: contain; background: #242a34; }
    footer { margin-top: 10px; color: #b5becc; font-size: 12px; flex-wrap: wrap; }
    #dash-status { color: #b8dce6; font-variant-numeric: tabular-nums; }
    .actions, .status { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #jump-status { color: #b8dce6; }
    #collection-status { color: #e7ca86; }
    #new-game { font-size: 12px; color: #b5becc; }
    .note { margin: 8px 0 0; color: #8793a4; font-size: 12px; }
    header.with-map { flex-wrap: wrap; }
    #world-map { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 18px; background: #202630; color: #e7e9ed; border: 1px solid #566173; }
    #world-map::backdrop { background: rgba(10, 14, 20, .8); }
    #world-map h2 { margin: 0; font-size: 18px; }
    #map-location { margin: 0 0 12px; color: #8ed0ff; }
    #map-graph { overflow: auto; }
    #map-graph svg { display: block; width: 100%; min-width: 760px; height: auto; }
    #map-graph text { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    .map-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; color: #a2abb9; font-size: 12px; }
    @media (max-width: 600px) { main { margin-top: 14px; } .sub { display: block; margin-left: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span id="game-title">探索试验场</span><span class="sub" id="room-name">读取地图中</span></h1>
      <div class="actions">
        <button id="open-map" type="button" hidden>整图 M</button>
        <button id="restart" type="button" disabled>返回存档 R</button>
        <button id="new-game" type="button" disabled>新游戏（清进度）</button>
      </div>
    </header>
    <section id="map-loader">
      <p id="map-status" role="status">正在读取 map.json…</p>
      <input id="map-file" type="file" accept=".json,application/json" aria-label="选择当前灰盒的 map.json" hidden>
      <button id="retry-map" type="button" hidden>重新读取 map.json</button>
    </section>
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="2D 探索战斗游戏。左右方向键或 A、D 移动，空格跳跃，解锁后在空中再按空格二段跳，Shift 冲刺，J 近战攻击，R 返回存档，F 全屏。"></canvas>
    <footer>
      <span id="controls">← → / A D 移动　空格 跳跃 / 二段跳　Shift 冲刺　J 攻击</span>
      <span class="status"><span id="jump-status">二段跳未解锁</span><span id="dash-status">冲刺未解锁</span><span id="collection-status">收集中</span></span>
    </footer>
    <p class="note" id="map-note">蓝色方块：能力　绿色方块：触碰存档　金色方块：隐藏收集物。R 返回存档 · F 全屏 · Esc 退出全屏</p>
    <p class="note" id="save-status">进度自动保存在当前浏览器。橙色范围是攻击前摇，红色范围会造成伤害。存档点可回血。</p>
  </main>
  <dialog id="world-map" aria-labelledby="world-map-title" aria-describedby="map-location">
    <header><h2 id="world-map-title">完整地图</h2><button id="close-map" type="button">返回游戏 · M / Esc</button></header>
    <p id="map-location"></p>
    <div id="map-graph" tabindex="0" aria-label="整图，可横向滚动"></div>
    <div class="map-legend"><span>蓝色框：你在这里</span><span>灰实框：已到达</span><span>灰虚框：未到达</span><span id="map-shortcut-legend" hidden>捷径：虚线未打通，实线已打通</span><span id="map-return-legend" hidden>紫色：11→09→12 回访</span></div>
  </dialog>
  <script>
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dashStatus = document.getElementById("dash-status");
  const VIEW = { width: canvas.width, height: canvas.height };
  const BODY = { width: 20, height: 38 };
  const STEP = 1 / 120; // 固定物理步长，让不同刷新率的移动手感一致。

  // 默认沿用五房地图；整图通过 ?map=world-map.json 选择。
  const MAP_FILE = new URLSearchParams(location.search).get("map") || "world-map.json";
  let MAP, ROOMS, CHECKPOINTS;
  let COLLECTIBLE_IDS = [];
  let mapReady = false;
  let mapError = "";
  const SAVE_KEY = "minimal-platformer-exploration-v1";
  let activeSaveKey = SAVE_KEY;
  const progress = {
    abilities: { doubleJump: false, dash: false },
    checkpoint: "", collected: new Set(), visited: new Set(), bossDefeated: false,
    openedRoutes: new Set(),
    flags: new Set(),
  };

  const keys = new Set();
  const camera = { x: 0, y: 0 };
  const player = {};
  let jumpBuffer = 0;
  let dashRequested = false;
  let animationTime = 0;
  let accumulator = 0;
  let lastFrame = 0;
  let manualTime = false;
  let paused = false;
  let mapOpen = false;
  let pausedBeforeMap = false;
  let roomId = "";
  let deaths = 0;
  let notice = "";
  let noticeTime = 0;
  let attackRequested = false;
  let portalRequested = false;
  let hitStopTime = 0;
  let shakeTime = 0;
  let effectClock = 0;
  const actionEffects = [];
  const effectStyle = {
    jump: { color: "#9bdbe8", count: 5, sweep: 1, travel: 23, streak: 4 },
    land: { color: "#b9ced7", count: 7, sweep: 1, travel: 28, streak: 5 },
    hit: { color: "#ffdb95", count: 8, sweep: 1.8, travel: 36, streak: 11 },
    hurt: { color: "#f69ba8", count: 7, sweep: 1.8, travel: 33, streak: 9 },
    defeat: { color: "#e9a6c5", count: 11, sweep: 1.8, travel: 46, streak: 11 },
  };
  let attackSerial = 0;
  let enemiesByRoom = {};
  let boss;
  let waves = [];
  let checkpointTouch = "";
  let storyTimers = {};
  const currentRoom = () => ROOMS[roomId];

  function notify(message) {
    notice = message;
    noticeTime = 4;
  }

  function conditionsMet(condition) {
    return (condition.requiredAbilities || []).every(id => progress.abilities[id])
      && (condition.requiresVisited || []).every(id => progress.visited.has(id))
      && (condition.requiresRoutes || []).every(id => progress.openedRoutes.has(id))
      && (condition.requiresFlags || []).every(id => progress.flags.has(id))
      && (condition.unlessFlags || []).every(id => !progress.flags.has(id))
      && (condition.bossDefeated === undefined || condition.bossDefeated === progress.bossDefeated);
  }

  function roomHint() {
    const room = currentRoom();
    return room.hints.find(conditionsMet)?.text || room.hint;
  }

  // 先检查引用和坐标，出错时停在加载界面，不改写已有存档。
  function validateMap(data) {
    const require = (ok, path) => { if (!ok) throw new Error(`地图字段有误：${path}`); };
    const record = value => value && typeof value === "object" && !Array.isArray(value);
    const numbers = (value, fields) => record(value) && fields.every(key => Number.isFinite(value[key]));
    const rect = value => numbers(value, ["x", "y", "w", "h"]) && value.w > 0 && value.h > 0;
    const abilities = value => Array.isArray(value) && value.every(id => Object.hasOwn(progress.abilities, id));
    require(data?.schemaVersion === 1 && record(data.rooms) && Object.keys(data.rooms).length > 0, "rooms / schemaVersion");
    const visited = value => value === undefined || (Array.isArray(value) && value.every(id => Object.hasOwn(data.rooms, id)));
    require(data.saveKey === undefined || (typeof data.saveKey === "string" && data.saveKey.length > 0), "saveKey");
    require(data.ui?.actionEffects === undefined || typeof data.ui.actionEffects === "boolean", "ui.actionEffects");
    require(data.routeLocks === undefined || record(data.routeLocks), "routeLocks");
    require(data.storyFlags === undefined || (Array.isArray(data.storyFlags)
      && data.storyFlags.every(id => typeof id === "string")), "storyFlags");
    const flags = value => value === undefined || (Array.isArray(value)
      && value.every(id => data.storyFlags?.includes(id)));
    const flagConditions = value => flags(value.requiresFlags) && flags(value.unlessFlags);
    require(data.camera === undefined || (numbers(data.camera, ["lookAhead", "verticalDeadZone"])
      && data.camera.lookAhead >= 0 && data.camera.verticalDeadZone >= 0), "camera");
    require(numbers(data.doorway, ["height", "belowFloor", "inset"])
      && data.doorway.height > 0 && data.doorway.belowFloor >= 0 && data.doorway.inset >= 0, "doorway");
    require(typeof data.abilityNotices?.dash === "string", "abilityNotices.dash");
    const itemIds = new Set();
    for (const [id, room] of Object.entries(data.rooms)) {
      if (data.ui?.showMap) require(numbers(room.position, ["x", "y"])
        && room.position.x >= 0 && room.position.y >= 0, `${id}.position`);
      require(room.mapLabel === undefined || typeof room.mapLabel === "string", `${id}.mapLabel`);
      require(numbers(room, ["width", "height"]) && room.width >= VIEW.width && room.height >= VIEW.height
        && typeof room.name === "string" && typeof room.hint === "string", `rooms.${id}`);
      require(Array.isArray(room.platforms) && room.platforms.every(rect), `${id}.platforms`);
      require(Array.isArray(room.signs) && room.signs.every(sign => numbers(sign, ["x", "y"])
        && typeof sign.text === "string"), `${id}.signs`);
      require(Array.isArray(room.hints) && room.hints.every(hint => record(hint) && typeof hint.text === "string"
        && (hint.requiredAbilities === undefined || abilities(hint.requiredAbilities))
        && visited(hint.requiresVisited)
        && (hint.bossDefeated === undefined || typeof hint.bossDefeated === "boolean")), `${id}.hints`);
      require(Array.isArray(room.items), `${id}.items`);
      for (const item of room.items) {
        require(rect(item) && typeof item.id === "string" && !itemIds.has(item.id)
          && ["ability", "collectible"].includes(item.kind), `${id}.items`);
        if (item.kind === "ability") require(abilities([item.id]) && typeof item.notice === "string", `${id}.items.${item.id}`);
        itemIds.add(item.id);
      }
      require(Array.isArray(room.enemies) && room.enemies.every(enemy => numbers(enemy, ["x", "floor", "min", "max"])
        && enemy.min <= enemy.x && enemy.x <= enemy.max
        && (enemy.triggerHeight === undefined || (Number.isFinite(enemy.triggerHeight) && enemy.triggerHeight > 0))), `${id}.enemies`);
      require(!room.enemies.some(enemy => ["scavenger", "shell-guard", "sludge-crab"].includes(enemy.kind)) || record(room.encounter), `${id}.encounter`);
      for (const field of ["barriers", "scenes"]) require(room[field] === undefined || (Array.isArray(room[field])
        && room[field].every(item => rect(item) && flagConditions(item) && typeof item.label === "string")), `${id}.${field}`);
      require(room.transitions === undefined || (Array.isArray(room.transitions) && room.transitions.every(item => numbers(item, ["delay"])
        && item.delay >= 0 && flagConditions(item) && data.storyFlags?.includes(item.setsFlag)
        && typeof item.notice === "string")), `${id}.transitions`);
      require(room.hints.every(flagConditions), `${id}.hints.flags`);
      require(room.interactions === undefined || (Array.isArray(room.interactions) && room.interactions.every(item => rect(item)
        && typeof item.id === "string" && typeof item.label === "string" && typeof item.message === "string"
        && ["resident", "observation", "exit"].includes(item.kind) && data.storyFlags?.includes(item.setsFlag)
        && flagConditions(item))), `${id}.interactions`);
      if (room.encounter) {
        require(typeof room.encounter.id === "string" && data.storyFlags?.includes(room.encounter.flag)
          && flagConditions(room.encounter) && room.enemies.length > 0
          && room.enemies.every(enemy => ["scavenger", "shell-guard", "sludge-crab"].includes(enemy.kind)
            && numbers(enemy, ["triggerX", "homeX"]) && enemy.homeX >= enemy.min && enemy.homeX <= enemy.max), `${id}.encounter`);
        if (room.enemies.some(e => e.kind === "sludge-crab")) require(data.storyFlags?.includes(room.encounter.lureFlag)
          && room.enemies.every(e => numbers(e, ["pitRight"]) && e.pitRight >= e.min && e.pitRight <= e.max), `${id}.encounter.lure`);
      }
      if (room.boss) require(rect(room.boss.spawn) && numbers(room.boss.arena, ["left", "right", "floor"])
        && room.boss.arena.left < room.boss.arena.right, `${id}.boss`);
      require(record(room.doors), `${id}.doors`);
      for (const [side, door] of Object.entries(room.doors)) {
        require(["left", "right"].includes(side) && numbers(door, ["floor"])
          && abilities(door.requiredAbilities) && Object.hasOwn(data.rooms, door.to)
          && ["left", "right"].includes(door.arrival), `${id}.doors.${side}`);
        require(numbers(data.rooms[door.to].doors?.[door.arrival], ["floor"]), `${id}.doors.${side}.arrival`);
      }
      require(room.entrances === undefined || (record(room.entrances) && Object.values(room.entrances)
        .every(entry => numbers(entry, ["x", "floor"]) && [-1, 1].includes(entry.facing))), `${id}.entrances`);
      require(room.portals === undefined || Array.isArray(room.portals), `${id}.portals`);
      const portalIds = new Set();
      for (const portal of room.portals || []) {
        require(rect(portal) && typeof portal.id === "string" && !portalIds.has(portal.id)
          && typeof portal.label === "string" && abilities(portal.requiredAbilities) && visited(portal.requiresVisited)
          && Object.hasOwn(data.rooms, portal.to) && flagConditions(portal), `${id}.portals`);
        require(numbers(data.rooms[portal.to].entrances?.[portal.arrival], ["x", "floor"]), `${id}.portals.${portal.id}.arrival`);
        require(portal.checkpoint === undefined || (typeof portal.checkpoint === "string" && data.checkpoints?.[portal.checkpoint]?.room === portal.to),
          `${id}.portals.${portal.id}.checkpoint`);
        require(portal.requiresRoutes === undefined || (Array.isArray(portal.requiresRoutes)
          && portal.requiresRoutes.every(key => Object.hasOwn(data.routeLocks || {}, key))), `${id}.portals.${portal.id}.requiresRoutes`);
        require(portal.opensRoute === undefined || Object.hasOwn(data.routeLocks || {}, portal.opensRoute), `${id}.portals.${portal.id}.opensRoute`);
        portalIds.add(portal.id);
      }
      require(room.markers === undefined || (Array.isArray(room.markers) && room.markers.every(marker => rect(marker)
        && typeof marker.kind === "string" && typeof marker.label === "string")), `${id}.markers`);
    }
    require(record(data.checkpoints) && typeof data.startCheckpoint === "string"
      && Object.hasOwn(data.checkpoints, data.startCheckpoint), "startCheckpoint / checkpoints");
    for (const [id, cp] of Object.entries(data.checkpoints)) {
      require(numbers(cp, ["x", "floor"]) && Object.hasOwn(data.rooms, cp.room)
        && typeof cp.name === "string", `checkpoints.${id}`);
    }
    for (const [id, room] of Object.entries(data.rooms)) {
      require(room.checkpoint === undefined || (Object.hasOwn(data.checkpoints, room.checkpoint)
        && data.checkpoints[room.checkpoint].room === id), `${id}.checkpoint`);
    }
  }

  function useMap(data) {
    if (mapReady) return;
    validateMap(data);
    MAP = data;
    ROOMS = data.rooms;
    CHECKPOINTS = data.checkpoints;
    activeSaveKey = data.saveKey || SAVE_KEY;
    COLLECTIBLE_IDS = Object.values(ROOMS).flatMap(room => room.items)
      .filter(item => item.kind === "collectible").map(item => item.id);
    progress.checkpoint = MAP.startCheckpoint;
    mapError = "";
    mapReady = true;
    document.getElementById("map-loader").hidden = true;
    document.getElementById("restart").disabled = false;
    document.getElementById("new-game").disabled = false;
    document.getElementById("collection-status").hidden = COLLECTIBLE_IDS.length === 0;
    const ui = data.ui || {};
    document.getElementById("open-map").hidden = !ui.showMap;
    if (ui.showMap) {
      document.querySelector("main > header").classList.add("with-map");
      document.getElementById("map-shortcut-legend").hidden = !Object.keys(data.routeLocks || {}).length;
      document.getElementById("map-return-legend").hidden = !data.returnRoutes?.length;
    }
    for (const [key, id] of Object.entries({ title: "game-title", controls: "controls", note: "map-note", saveNotice: "save-status" })) {
      if (ui[key]) document.getElementById(id).textContent = ui[key];
    }
    if (ui.canvasLabel) canvas.setAttribute("aria-label", ui.canvasLabel);
    loadProgress();
    reset();
    notify(progress.checkpoint === MAP.startCheckpoint && !progress.abilities.doubleJump
      ? roomHint() : `从${CHECKPOINTS[progress.checkpoint].name}继续 · 已恢复本地进度`);
    requestAnimationFrame(frame);
  }

  function showMapError(error) {
    mapError = error.message;
    document.getElementById("map-status").textContent = `未能读取 ${MAP_FILE}：${mapError}。请修正后重新读取，或选择地图文件。`;
    document.getElementById("map-file").hidden = false;
    document.getElementById("retry-map").hidden = location.protocol === "file:";
  }

  async function startMapLoad() {
    document.getElementById("map-file").setAttribute("aria-label", `选择当前灰盒的 ${MAP_FILE}`);
    document.getElementById("retry-map").textContent = `重新读取 ${MAP_FILE}`;
    if (location.protocol === "file:") {
      document.getElementById("map-status").textContent = `请选择同目录的 ${MAP_FILE}，读取后开始灰盒试玩。`;
      document.getElementById("map-file").hidden = false;
      return;
    }
    document.getElementById("map-status").textContent = `正在读取 ${MAP_FILE}…`;
    document.getElementById("retry-map").hidden = true;
    try {
      const response = await fetch(MAP_FILE, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      useMap(await response.json());
    } catch (error) { showMapError(error); }
  }

  document.getElementById("map-file").addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;
    try { useMap(JSON.parse(await file.text())); }
    catch (error) { showMapError(error); }
    event.target.value = "";
  });
  document.getElementById("retry-map").addEventListener("click", startMapLoad);

  function storageUnavailable() {
    document.getElementById("save-status").textContent = "浏览器未允许本地存储；本次游玩的存档和能力仍有效，关闭页面后不保留。";
  }

  function saveProgress() {
    try {
      localStorage.setItem(activeSaveKey, JSON.stringify({
        checkpoint: progress.checkpoint, abilities: progress.abilities,
        collected: [...progress.collected], visited: [...progress.visited],
        bossDefeated: progress.bossDefeated,
        ...(MAP.routeLocks ? { openedRoutes: [...progress.openedRoutes] } : {}),
        ...(MAP.storyFlags ? { flags: [...progress.flags] } : {}),
      }));
    } catch { storageUnavailable(); }
  }

  function loadProgress() {
    try {
      const data = JSON.parse(localStorage.getItem(activeSaveKey));
      if (!data || typeof data !== "object") return;
      progress.bossDefeated = data.bossDefeated === true;
      if (Object.hasOwn(CHECKPOINTS, data.checkpoint)) progress.checkpoint = data.checkpoint;
      for (const ability of ["doubleJump", "dash"]) {
        progress.abilities[ability] = data.abilities?.[ability] === true;
      }
      if (Array.isArray(data.collected)) progress.collected = new Set(data.collected.filter(id => COLLECTIBLE_IDS.includes(id)));
      if (Array.isArray(data.visited)) progress.visited = new Set(data.visited.filter(id => Object.hasOwn(ROOMS, id)));
      if (Array.isArray(data.openedRoutes)) progress.openedRoutes = new Set(data.openedRoutes
        .filter(id => Object.hasOwn(MAP.routeLocks || {}, id)));
      if (Array.isArray(data.flags)) progress.flags = new Set(data.flags.filter(id => MAP.storyFlags?.includes(id)));
    } catch { storageUnavailable(); }
  }

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const approach = (value, target, amount) => value < target
    ? Math.min(value + amount, target) : Math.max(value - amount, target);
  const horizontalInput = () => Number(keys.has("ArrowRight") || keys.has("KeyD"))
    - Number(keys.has("ArrowLeft") || keys.has("KeyA"));

  function cameraTarget(snap = false) {
    const room = currentRoom();
    const lookAhead = MAP.camera?.lookAhead ?? CONFIG.cameraLookAhead;
    const desiredY = clamp(player.y + BODY.height / 2 - VIEW.height * 0.6, 0, room.height - VIEW.height);
    // 整图在普通跳跃时保留纵向缓冲，落地后再平滑跟随台面高度。
    const margin = !snap && !player.grounded ? MAP.camera?.verticalDeadZone || 0 : 0;
    return {
      x: clamp(player.x + BODY.width / 2 + player.facing * lookAhead
        - VIEW.width / 2, 0, room.width - VIEW.width),
      y: margin > 0 ? clamp(camera.y, desiredY - margin, desiredY + margin) : desiredY,
    };
  }

  function reset() {
    const checkpoint = CHECKPOINTS[progress.checkpoint];
    roomId = checkpoint.room;
    progress.visited.add(roomId);
    Object.assign(player, {
      x: checkpoint.x, y: checkpoint.floor - BODY.height, vx: 0, vy: 0, facing: 1,
      grounded: true, coyote: CONFIG.coyoteTime, jumpCut: false,
      dashTime: 0, cooldown: 0, dashDirection: 1, extraJumpUsed: false,
      health: CONFIG.playerHealth, invulnerable: CONFIG.hurtInvulnerability, hurtTime: 0,
      attackTime: 0, attackCooldown: 0, attackFacing: 1,
    });
    keys.clear();
    jumpBuffer = 0;
    dashRequested = false;
    attackRequested = false;
    portalRequested = false;
    checkpointTouch = progress.checkpoint;
    actionEffects.length = 0;
    resetCombat();
    storyTimers = {};
    animationTime = 0;
    accumulator = 0;
    Object.assign(camera, cameraTarget(true));
    draw();
  }

  function newGame() {
    progress.abilities.doubleJump = false;
    progress.abilities.dash = false;
    progress.checkpoint = MAP.startCheckpoint;
    progress.bossDefeated = false;
    progress.collected.clear();
    progress.openedRoutes.clear();
    progress.flags.clear();
    progress.visited = new Set([CHECKPOINTS[MAP.startCheckpoint].room]);
    deaths = 0;
    paused = false;
    saveProgress();
    reset();
    notify(roomHint());
  }

  function doorIsOpen(side) {
    const door = currentRoom().doors[side];
    return door && conditionsMet(door)
      && player.y + BODY.height > door.floor - MAP.doorway.height
      && player.y + BODY.height <= door.floor + MAP.doorway.belowFloor;
  }

  function changeRoom(side) {
    const source = currentRoom().doors[side];
    const relativeFeet = player.y + BODY.height - source.floor;
    roomId = source.to;
    const destination = currentRoom();
    const arrivalSide = source.arrival;
    const arrival = destination.doors[arrivalSide];
    player.x = arrivalSide === "left" ? MAP.doorway.inset : destination.width - BODY.width - MAP.doorway.inset;
    player.y = arrival.floor - BODY.height + relativeFeet;
    finishRoomChange();
  }

  function finishRoomChange(checkpoint = currentRoom().checkpoint) {
    player.attackTime = 0;
    actionEffects.length = 0;
    attackRequested = false;
    portalRequested = false;
    waves = [];
    hitStopTime = 0;
    shakeTime = 0;
    boss = createBoss();
    progress.visited.add(roomId);
    if (checkpoint) {
      progress.checkpoint = checkpoint;
      checkpointTouch = progress.checkpoint;
    }
    Object.assign(camera, cameraTarget(true));
    saveProgress();
    notify(roomHint());
  }

  // 室内门框用于多出口地图；原五房仍使用原来的边缘自动换房。
  function enterPortal() {
    const portal = (currentRoom().portals || []).find(overlaps);
    if (!portal) return;
    if (!conditionsMet(portal)) { notify(portal.lockedHint || "此出口尚未开放"); return; }
    const newlyOpened = portal.opensRoute && !progress.openedRoutes.has(portal.opensRoute);
    if (portal.opensRoute) progress.openedRoutes.add(portal.opensRoute);
    roomId = portal.to;
    const arrival = currentRoom().entrances[portal.arrival];
    Object.assign(player, { x: arrival.x, y: arrival.floor - BODY.height, facing: arrival.facing,
      vx: 0, vy: 0, grounded: true, coyote: CONFIG.coyoteTime, dashTime: 0, extraJumpUsed: false });
    jumpBuffer = 0;
    dashRequested = false;
    finishRoomChange(portal.checkpoint);
    if (newlyOpened) notify(`${portal.routeLabel}已打通 · 两端现在可以往返`);
  }

  function enterInteraction() {
    const item = (currentRoom().interactions || []).find(item => overlaps({ ...item, x: item.x - 24, w: item.w + 48 })
      && (item.unlessFlags || []).every(id => !progress.flags.has(id)));
    if (!item) return false;
    if (!conditionsMet(item)) { notify(item.lockedMessage || "先完成当前目标"); return true; }
    const done = progress.flags.has(item.setsFlag);
    if (done && item.kind === "exit") return false;
    progress.flags.add(item.setsFlag);
    saveProgress();
    notify(done ? item.repeatMessage || item.message : item.message);
    return true;
  }

  function updateObjects() {
    const touched = Object.entries(CHECKPOINTS).find(([id, cp]) => id !== MAP.startCheckpoint
      && cp.room === roomId && player.grounded
      && Math.abs(player.x + BODY.width / 2 - cp.x) < 34
      && Math.abs(player.y + BODY.height - cp.floor) < 8);
    if (touched && checkpointTouch !== touched[0]) {
      progress.checkpoint = touched[0];
      player.health = CONFIG.playerHealth;
      saveProgress();
      notify(`已存档并回满生命 · ${touched[1].name}`);
    }
    checkpointTouch = touched ? touched[0] : "";
    for (const item of currentRoom().items) {
      if (!overlaps(item)) continue;
      if (item.kind === "ability" && !progress.abilities[item.id]) {
        progress.abilities[item.id] = true;
        notify(item.notice);
        saveProgress();
      } else if (item.kind === "collectible" && !progress.collected.has(item.id)) {
        progress.collected.add(item.id);
        notify(`找到隐藏收集物 · ${progress.collected.size} / ${COLLECTIBLE_IDS.length}`);
        saveProgress();
      }
    }
  }

  function overlaps(platform) {
    return player.x < platform.x + platform.w && player.x + BODY.width > platform.x
      && player.y < platform.y + platform.h && player.y + BODY.height > platform.y;
  }

  function roomSolids() {
    return currentRoom().platforms.concat((currentRoom().barriers || []).filter(conditionsMet));
  }

  function moveHorizontal(dt) {
    const distance = player.vx * dt;
    player.x += distance;
    for (const platform of roomSolids()) {
      if (!overlaps(platform)) continue;
      if (distance > 0) player.x = platform.x - BODY.width;
      if (distance < 0) player.x = platform.x + platform.w;
      player.vx = 0;
      player.dashTime = 0;
    }
    const room = currentRoom();
    const bounded = clamp(player.x, doorIsOpen("left") ? -BODY.width : 0,
      doorIsOpen("right") ? room.width : room.width - BODY.width);
    if (bounded !== player.x) {
      player.vx = 0;
      player.dashTime = 0;
    }
    player.x = bounded;
  }

  function moveVertical(dt) {
    const wasGrounded = player.grounded, fallSpeed = player.vy;
    const distance = player.vy * dt;
    player.y += distance;
    player.grounded = false;
    for (const platform of roomSolids()) {
      if (!overlaps(platform)) continue;
      if (distance > 0) {
        player.y = platform.y - BODY.height;
        player.grounded = true;
        player.extraJumpUsed = false;
      } else if (distance < 0) {
        player.y = platform.y + platform.h;
      }
      player.vy = 0;
    }
    if (!wasGrounded && player.grounded && fallSpeed >= CONFIG.landingEffectSpeed) {
      addActionEffect("land", player.x + BODY.width / 2, player.y + BODY.height - 2);
    }
  }

  function tryJump() {
    if (jumpBuffer <= 0 || player.dashTime > 0 || player.hurtTime > 0) return;
    const groundJump = player.grounded || player.coyote > 0;
    if (!groundJump && (!progress.abilities.doubleJump || player.extraJumpUsed)) return;
    addActionEffect("jump", player.x + BODY.width / 2, player.y + BODY.height - 2);
    player.extraJumpUsed = !groundJump;
    player.vy = -CONFIG.jumpSpeed * (groundJump ? 1 : CONFIG.doubleJumpMultiplier);
    player.grounded = false;
    player.coyote = 0;
    player.jumpCut = false;
    jumpBuffer = 0;
  }

  function createBoss() {
    const spawn = currentRoom().boss?.spawn;
    if (!spawn) return null;
    return { ...spawn, hp: progress.bossDefeated ? 0 : CONFIG.bossHealth,
      active: false, state: "idle", move: "", timer: CONFIG.bossRecovery,
      cycle: 0, dir: 1, flash: 0, lastSwing: -1 };
  }

  function resetCombat() {
    enemiesByRoom = Object.fromEntries(Object.entries(ROOMS).map(([id, room]) => [id,
      room.enemies.map((spawn, index) => {
        const critter = spawn.kind === "critter", height = critter ? 20 : 28;
        return {
          ...spawn, id: `${id}-${index}`, y: spawn.floor - height,
          w: 24, h: height, hp: critter ? CONFIG.critterHealth : CONFIG.enemyHealth, dir: -1, vx: 0, vy: 0,
          flash: 0, stun: 0, lastSwing: -1,
          ...(spawn.kind === "scavenger" ? { hp: progress.flags.has(room.encounter.flag) ? 0 : CONFIG.enemyHealth,
            state: progress.flags.has(room.encounter.flag) ? "withdrawn" : "dormant", timer: 0 } : {}),
          ...(spawn.kind === "shell-guard" ? { w: 64, h: 54, y: spawn.floor - 54,
            hp: progress.flags.has(room.encounter.flag) ? 0 : CONFIG.guardHealth,
            state: progress.flags.has(room.encounter.flag) ? "withdrawn" : "dormant", timer: 0, cycle: 0, move: "claw" } : {}),
          ...(spawn.kind === "sludge-crab" ? { w: 58, h: 44, y: spawn.floor - 44,
            hp: progress.flags.has(room.encounter.flag) ? 0 : CONFIG.sludgeHealth,
            state: progress.flags.has(room.encounter.flag) ? "withdrawn" : "dormant", timer: 0 } : {}),
        };
      }),
    ]));
    boss = createBoss();
    waves = [];
    hitStopTime = 0;
    shakeTime = 0;
    attackSerial = 0;
  }

  function touches(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function playerBox() {
    return { x: player.x, y: player.y, w: BODY.width, h: BODY.height };
  }

  function attackBox() {
    return { x: player.attackFacing > 0 ? player.x + BODY.width - 2 : player.x - CONFIG.attackRange + 2,
      y: player.y + BODY.height / 2 - CONFIG.attackHeight / 2,
      w: CONFIG.attackRange, h: CONFIG.attackHeight };
  }

  function hitFeedback() {
    hitStopTime = CONFIG.hitStop;
    shakeTime = CONFIG.shakeDuration;
  }

  function addActionEffect(kind, x, y) {
    if (MAP.ui?.actionEffects) actionEffects.push({ kind, x, y, started: effectClock });
  }

  function die(reason) {
    deaths++;
    reset();
    notify(`${reason} · 已回到${CHECKPOINTS[progress.checkpoint].name}，能力和收集物保留`);
  }

  function hurtPlayer(sourceX) {
    if (player.invulnerable > 0) return;
    player.health = Math.max(0, player.health - CONFIG.contactDamage);
    if (player.health <= 0) { die("生命耗尽"); return; }
    player.invulnerable = CONFIG.hurtInvulnerability;
    player.hurtTime = CONFIG.hurtStun;
    player.vx = (player.x + BODY.width / 2 >= sourceX ? 1 : -1) * CONFIG.hurtKnockbackX;
    player.vy = -CONFIG.hurtKnockbackY;
    player.grounded = false;
    player.coyote = 0;
    player.dashTime = 0;
    player.attackTime = 0;
    attackRequested = false;
    addActionEffect("hurt", player.x + BODY.width / 2, player.y + BODY.height / 2);
    hitFeedback();
  }

  function updatePlayerCombat(dt) {
    for (const timer of ["invulnerable", "hurtTime", "attackTime", "attackCooldown"]) {
      player[timer] = Math.max(0, player[timer] - dt);
    }
    if (attackRequested && player.attackCooldown <= 0 && player.hurtTime <= 0) {
      attackSerial++;
      player.attackTime = CONFIG.attackDuration;
      player.attackCooldown = CONFIG.attackCooldown;
      player.attackFacing = player.facing;
    }
    attackRequested = false;
  }

  function updateEnemies(dt) {
    for (const enemy of enemiesByRoom[roomId]) {
      if (enemy.kind === "scavenger" && updateScavenger(enemy, dt)) continue;
      if (enemy.kind === "shell-guard") { updateGuard(enemy, dt); continue; }
      if (enemy.kind === "sludge-crab") { updateSludgeCrab(enemy, dt); continue; }
      if (enemy.hp <= 0) continue;
      enemy.flash = Math.max(0, enemy.flash - dt);
      enemy.stun = Math.max(0, enemy.stun - dt);
      enemy.vx = enemy.stun > 0 ? approach(enemy.vx, 0, CONFIG.enemyKnockbackFriction * dt) : enemy.dir * CONFIG.enemySpeed;
      enemy.x += enemy.vx * dt;
      if (enemy.x <= enemy.min || enemy.x >= enemy.max) {
        enemy.x = clamp(enemy.x, enemy.min, enemy.max);
        enemy.dir *= -1;
        enemy.vx = 0;
      }
      enemy.vy += CONFIG.gravity * dt;
      enemy.y = Math.min(enemy.floor - enemy.h, enemy.y + enemy.vy * dt);
      if (enemy.y === enemy.floor - enemy.h) enemy.vy = 0;
    }
  }

  // 返回 true 表示已由食腐甲状态机完成更新；原巡逻敌人继续走原逻辑。
  function updateScavenger(enemy, dt) {
    if (enemy.hp <= 0 || enemy.state === "withdrawn") {
      enemy.state = "withdrawn";
      enemy.flash = Math.max(0, enemy.flash - dt);
      enemy.vx = enemy.vy = enemy.stun = 0;
      enemy.x = approach(enemy.x, enemy.homeX, CONFIG.scavengerRetreatSpeed * dt);
      enemy.y = enemy.floor - enemy.h;
      return true;
    }
    if (enemy.state === "dormant") {
      if (!conditionsMet(currentRoom().encounter) || player.x < enemy.triggerX) return true;
      if (enemy.triggerHeight !== undefined
        && (Math.abs(player.x - enemy.x) >= CONFIG.scavengerReach
          || Math.abs(player.y + BODY.height - enemy.floor) > enemy.triggerHeight)) return true;
      enemy.state = "recovery";
      enemy.timer = 0;
      notify(currentRoom().encounter.startNotice || "食腐甲被惊动 · 橙色蓄力后近扑，跳开后趁收招按 J 反击");
    }
    if (enemy.stun > 0) { enemy.state = "recovery"; enemy.timer = CONFIG.scavengerRecovery; return false; }
    enemy.flash = Math.max(0, enemy.flash - dt);
    enemy.timer = Math.max(0, enemy.timer - dt);
    if (enemy.state === "recovery" && enemy.timer === 0
      && Math.abs(player.y + BODY.height - enemy.floor) < 80
      && Math.abs(player.x - enemy.x) < CONFIG.scavengerReach) {
      enemy.dir = player.x >= enemy.x ? 1 : -1;
      enemy.state = "windup";
      enemy.timer = CONFIG.scavengerWindup;
    } else if (enemy.state === "windup" && enemy.timer === 0) {
      enemy.state = "lunge";
      enemy.timer = CONFIG.scavengerLunge;
    } else if (enemy.state === "lunge" && enemy.timer === 0) {
      enemy.state = "recovery";
      enemy.timer = CONFIG.scavengerRecovery;
    }
    enemy.vx = enemy.state === "lunge" ? enemy.dir * CONFIG.scavengerSpeed : 0;
    enemy.x = clamp(enemy.x + enemy.vx * dt, enemy.min, enemy.max);
    enemy.y = Math.min(enemy.floor - enemy.h, enemy.y + enemy.vy * dt);
    enemy.vy = enemy.y < enemy.floor - enemy.h ? enemy.vy + CONFIG.gravity * dt : 0;
    return true;
  }

  function enemyIsHostile(enemy) {
    return enemy.hp > 0 && !["dormant", "withdrawn"].includes(enemy.state);
  }

  function guardThreatBox(enemy) {
    return { x: enemy.dir > 0 ? enemy.x + enemy.w : enemy.x - CONFIG.guardAttackRange,
      y: enemy.floor - 42, w: CONFIG.guardAttackRange, h: 42 };
  }

  function updateGuard(enemy, dt) {
    enemy.flash = Math.max(0, enemy.flash - dt);
    if (enemy.state === "withdrawn") {
      enemy.x = approach(enemy.x, enemy.homeX, CONFIG.scavengerRetreatSpeed * dt);
      return;
    }
    if (enemy.state === "dormant") {
      if (!conditionsMet(currentRoom().encounter) || player.x < enemy.triggerX) return;
      enemy.state = "recovery";
    }
    enemy.timer = Math.max(0, enemy.timer - dt);
    if (enemy.state === "recovery" && enemy.timer === 0
      && Math.abs(player.x - enemy.x) < 440 && Math.abs(player.y + BODY.height - enemy.floor) < 120) {
      enemy.dir = player.x + BODY.width / 2 >= enemy.x + enemy.w / 2 ? 1 : -1;
      enemy.move = enemy.cycle++ % 2 ? "press" : "claw";
      enemy.state = "windup";
      enemy.timer = enemy.move === "claw" ? CONFIG.guardClawWindup : CONFIG.guardPressWindup;
    } else if (enemy.state === "windup" && enemy.timer === 0) {
      enemy.state = "active";
      enemy.timer = enemy.move === "claw" ? CONFIG.guardClawDuration : CONFIG.guardPressDuration;
    } else if (enemy.state === "active" && enemy.timer === 0) {
      enemy.state = "recovery";
      enemy.timer = CONFIG.guardRecovery;
    }
    enemy.vx = enemy.state === "active" && enemy.move === "press" ? enemy.dir * CONFIG.guardPressSpeed : 0;
    enemy.x = clamp(enemy.x + enemy.vx * dt, enemy.min, enemy.max);
  }

  function updateEncounter() {
    const encounter = currentRoom().encounter;
    if (!encounter || progress.flags.has(encounter.flag)
      || !enemiesByRoom[roomId].every(enemy => enemy.state === "withdrawn")) return;
    progress.flags.add(encounter.flag);
    saveProgress();
    notify(encounter.notice);
  }

  function updateSludgeCrab(enemy, dt) {
    enemy.flash = Math.max(0, enemy.flash - dt);
    if (enemy.state === "withdrawn") {
      enemy.x = approach(enemy.x, enemy.homeX, CONFIG.scavengerRetreatSpeed * dt);return;
    }
    if (enemy.state === "dormant") {
      if (!conditionsMet(currentRoom().encounter) || player.x < enemy.triggerX) return;
      enemy.state = "chase";
      notify("污絮中的大甲扑出 · 向左退到空置低坑，避开狭窄旧巢槽");
    }
    enemy.timer = Math.max(0, enemy.timer - dt);
    if ((enemy.state === "recovery" && enemy.timer === 0) || enemy.state === "chase") {
      enemy.dir = player.x + BODY.width / 2 >= enemy.x + enemy.w / 2 ? 1 : -1;
      if (Math.abs(player.x - enemy.x) < 145 && Math.abs(player.y + BODY.height - enemy.floor) < 90) {
        enemy.state = "windup";enemy.timer = CONFIG.sludgeWindup;
      } else enemy.state = "chase";
    } else if (enemy.state === "windup" && enemy.timer === 0) {
      enemy.state = "lunge";enemy.timer = CONFIG.sludgeLungeDuration;
    } else if (enemy.state === "lunge" && enemy.timer === 0) {
      enemy.state = "recovery";enemy.timer = CONFIG.sludgeRecovery;
    }
    enemy.vx = enemy.state === "chase" ? enemy.dir * CONFIG.sludgeChaseSpeed
      : enemy.state === "lunge" ? enemy.dir * CONFIG.sludgeLungeSpeed : 0;
    enemy.x = clamp(enemy.x + enemy.vx * dt, enemy.min, enemy.max);
    const flag = currentRoom().encounter.lureFlag;
    if (enemy.x <= enemy.pitRight && !progress.flags.has(flag)) {
      progress.flags.add(flag);saveProgress();notify("大甲已离开巢槽 · 低坑内等近扑收招，攻击抬起的腹侧");
    }
  }

  function updateStory(dt) {
    for (const event of currentRoom().transitions || []) {
      if (progress.flags.has(event.setsFlag) || !conditionsMet(event)) continue;
      storyTimers[event.setsFlag] = (storyTimers[event.setsFlag] || 0) + dt;
      if (storyTimers[event.setsFlag] < event.delay) continue;
      progress.flags.add(event.setsFlag);saveProgress();notify(event.notice);
    }
  }

  function bossSweepBox() {
    return { x: boss.dir > 0 ? boss.x + boss.w : boss.x - CONFIG.bossSweepRange,
      y: currentRoom().boss.arena.floor - 42, w: CONFIG.bossSweepRange, h: 42 };
  }

  function beginBossWindup() {
    boss.state = "windup";
    boss.move = ["sweep", "charge", "slam"][boss.cycle++ % 3];
    boss.dir = player.x + BODY.width / 2 >= boss.x + boss.w / 2 ? 1 : -1;
    boss.timer = { sweep: CONFIG.bossSweepWindup, charge: CONFIG.bossChargeWindup,
      slam: CONFIG.bossSlamWindup }[boss.move];
  }

  function updateBoss(dt) {
    if (!boss || boss.hp <= 0) return;
    boss.flash = Math.max(0, boss.flash - dt);
    if (!boss.active) {
      if (player.x > currentRoom().boss.arena.right + 20 || player.x < currentRoom().boss.arena.left - 100) return;
      boss.active = true;
      notify("守门人苏醒 · 横扫、冲撞、震地；橙色前摇时准备跳开");
    }
    boss.timer -= dt;
    if (boss.state === "active" && boss.move === "charge") {
      boss.x = clamp(boss.x + boss.dir * CONFIG.bossChargeSpeed * dt,
        currentRoom().boss.arena.left, currentRoom().boss.arena.right - boss.w);
    }
    if (boss.timer > 0) return;
    if (boss.state === "idle" || boss.state === "recovery") {
      beginBossWindup();
    } else if (boss.state === "windup") {
      boss.state = "active";
      boss.timer = { sweep: CONFIG.bossSweepDuration, charge: CONFIG.bossChargeDuration,
        slam: CONFIG.bossSlamDuration }[boss.move];
      if (boss.move === "slam") {
        waves.push(...[-1, 1].map(dir => ({ x: boss.x + boss.w / 2 - 13,
          y: currentRoom().boss.arena.floor - 20, w: 26, h: 20, vx: dir * CONFIG.bossWaveSpeed,
          life: CONFIG.bossWaveLifetime })));
      }
    } else {
      boss.state = "recovery";
      boss.timer = CONFIG.bossRecovery;
    }
  }

  function resolvePlayerAttack() {
    if (player.attackTime <= 0) return;
    const box = attackBox();
    for (const enemy of enemiesByRoom[roomId]) {
      if (!enemyIsHostile(enemy) || enemy.lastSwing === attackSerial || !touches(box, enemy)) continue;
      enemy.lastSwing = attackSerial;
      const inFront = (player.x + BODY.width / 2 - enemy.x - enemy.w / 2) * enemy.dir > 0;
      if (enemy.kind === "shell-guard" && inFront && enemy.state !== "recovery") {
        hitFeedback();
        notify("重壳挡住攻击 · 跳到扣带一侧，或等收招再反击");
        continue;
      }
      if (enemy.kind === "sludge-crab" && (enemy.x > enemy.pitRight || enemy.state !== "recovery")) {
        hitFeedback();notify("甲缘挡住攻击 · 引向左侧低坑，等近扑收招露出腹侧");continue;
      }
      enemy.hp = Math.max(0, enemy.hp - CONFIG.attackDamage);
      enemy.flash = CONFIG.hitFlash;
      if (!["shell-guard", "sludge-crab"].includes(enemy.kind)) {
        enemy.stun = CONFIG.enemyStun;
        enemy.vx = player.attackFacing * CONFIG.enemyKnockback;
        enemy.vy = -CONFIG.enemyKnockbackY;
      }
      if (enemy.hp <= 0 && ["scavenger", "shell-guard", "sludge-crab"].includes(enemy.kind)) enemy.state = "withdrawn";
      addActionEffect(enemy.hp > 0 ? "hit" : "defeat", enemy.x + enemy.w / 2, enemy.y + enemy.h / 2);
      hitFeedback();
    }
    if (!boss || boss.hp <= 0 || boss.lastSwing === attackSerial || !touches(box, boss)) return;
    boss.hp = Math.max(0, boss.hp - CONFIG.attackDamage);
    boss.lastSwing = attackSerial;
    boss.flash = CONFIG.hitFlash;
    addActionEffect(boss.hp > 0 ? "hit" : "defeat", boss.x + boss.w / 2, boss.y + boss.h / 2);
    hitFeedback();
    if (boss.hp <= 0) {
      boss.active = false;
      boss.state = "defeated";
      waves = [];
      progress.bossDefeated = true;
      saveProgress();
      notify("已击败守门人 · 胜利已保存，还可以继续寻找隐藏收集物");
    }
  }

  function updateCombat(dt) {
    updateEnemies(dt);
    updateBoss(dt);
    for (const wave of waves) { wave.x += wave.vx * dt; wave.life -= dt; }
    waves = waves.filter(wave => wave.life > 0 && wave.x >= currentRoom().boss.arena.left && wave.x + wave.w <= currentRoom().boss.arena.right);
    resolvePlayerAttack();
    for (const enemy of enemiesByRoom[roomId]) {
      if (enemyIsHostile(enemy) && enemy.stun <= 0 && touches(playerBox(), enemy)) hurtPlayer(enemy.x + enemy.w / 2);
      if (enemy.kind === "shell-guard" && enemy.state === "active" && enemy.move === "claw"
        && touches(playerBox(), guardThreatBox(enemy))) hurtPlayer(enemy.x + enemy.w / 2);
    }
    updateEncounter();
    if (!boss || boss.hp <= 0 || !boss.active) return;
    if (touches(playerBox(), boss)) hurtPlayer(boss.x + boss.w / 2);
    if (boss.state === "active" && boss.move === "sweep" && touches(playerBox(), bossSweepBox())) {
      hurtPlayer(boss.x + boss.w / 2);
    }
    for (const wave of waves) if (touches(playerBox(), wave)) hurtPlayer(wave.x + wave.w / 2);
  }

  function update(dt) {
    effectClock += dt;
    while (actionEffects.length && effectClock - actionEffects[0].started >= CONFIG.actionEffectLifetime) actionEffects.shift();
    shakeTime = Math.max(0, shakeTime - dt);
    if (hitStopTime > 0) { hitStopTime = Math.max(0, hitStopTime - dt); return; }
    animationTime += dt;
    noticeTime = Math.max(0, noticeTime - dt);
    player.cooldown = Math.max(0, player.cooldown - dt);
    player.coyote = player.grounded ? CONFIG.coyoteTime : Math.max(0, player.coyote - dt);
    const direction = horizontalInput();
    if (direction && player.dashTime <= 0) player.facing = direction;
    updatePlayerCombat(dt);

    tryJump();
    if (dashRequested && !progress.abilities.dash) notify(MAP.abilityNotices.dash);
    if (dashRequested && progress.abilities.dash && player.cooldown <= 0 && player.dashTime <= 0 && player.hurtTime <= 0) {
      player.dashDirection = direction || player.facing;
      player.facing = player.dashDirection;
      player.dashTime = CONFIG.dashDuration;
      player.cooldown = CONFIG.dashCooldown;
      player.vy = 0;
    }
    dashRequested = false;

    if (player.dashTime > 0) {
      player.vx = player.dashDirection * CONFIG.dashSpeed;
      player.dashTime = Math.max(0, player.dashTime - dt);
      moveHorizontal(dt);
      // 水平冲刺不做垂直位移，但要更新脚下支撑，避免离台后还算站在地面。
      player.grounded = roomSolids().some(p => player.x < p.x + p.w
        && player.x + BODY.width > p.x && Math.abs(player.y + BODY.height - p.y) < 0.01);
      if (player.grounded) player.extraJumpUsed = false;
      if (player.dashTime <= 0 && player.vx !== 0) {
        player.vx = player.dashDirection * CONFIG.dashExitSpeed;
      }
    } else {
      const control = player.grounded ? 1 : CONFIG.airControl;
      const acceleration = direction ? CONFIG.acceleration : CONFIG.deceleration;
      if (player.hurtTime <= 0) player.vx = approach(player.vx, direction * CONFIG.moveSpeed, acceleration * control * dt);
      // 松开空格只削减一次上升速度；长按则保留完整的上升过程。
      if (!keys.has("Space") && player.vy < 0 && !player.jumpCut && player.hurtTime <= 0) {
        player.vy *= CONFIG.jumpReleaseMultiplier;
        player.jumpCut = true;
      }
      const gravity = CONFIG.gravity * (player.vy > 0 ? CONFIG.fallGravityMultiplier : 1);
      player.vy = Math.min(player.vy + gravity * dt, CONFIG.maxFallSpeed);
      moveHorizontal(dt);
      moveVertical(dt);
      // 落地当帧消费缓冲，短按后已松开也能触发。
      if (player.grounded) tryJump();
    }

    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (player.y > currentRoom().height + 60) {
      die("坠落");
      return;
    }
    if (player.x < 0 && doorIsOpen("left")) changeRoom("left");
    else if (player.x + BODY.width > currentRoom().width && doorIsOpen("right")) changeRoom("right");
    if (portalRequested) { portalRequested = false; if (!enterInteraction()) enterPortal(); }
    updateObjects();
    updateCombat(dt);
    updateStory(dt);
    const target = cameraTarget();
    const blend = 1 - Math.exp(-CONFIG.cameraFollow * dt);
    camera.x += (target.x - camera.x) * blend;
    camera.y += (target.y - camera.y) * blend;
  }

  // 角色只由像素矩形和粗线条组成。碰撞盒固定，姿态不影响碰撞。
  function drawPlayer() {
    const moving = Math.abs(player.vx) > 15;
    const running = player.grounded && moving;
    const stride = running ? Math.sin(animationTime * 18) * 6 : 0;
    const bob = running ? Math.round(Math.abs(stride) / 3) : 0;
    const airborne = !player.grounded;
    ctx.save();
    if (player.invulnerable > 0 && Math.floor(player.invulnerable * 16) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.translate(Math.round(player.x + BODY.width / 2), Math.round(player.y));
    ctx.scale(player.facing, 1);
    ctx.fillStyle = player.dashTime > 0 ? "#b8dce6" : "#f0eee6";
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = 4;
    ctx.lineCap = "square";
    ctx.fillRect(-5, bob, 10, 10); // 头
    ctx.fillRect(-2, 11 + bob, 5, 13); // 身体
    function limb(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(Math.round(x2), Math.round(y2));
      ctx.stroke();
    }
    if (player.dashTime > 0) {
      limb(0, 15, -10, 19);
      limb(1, 15, 9, 13);
      limb(0, 24, -9, 33);
      limb(0, 24, 4, 32);
    } else if (airborne) {
      limb(0, 15, -8, 10);
      limb(1, 15, 8, 10);
      limb(0, 24, -7, 33);
      limb(0, 24, 7, 29);
    } else {
      limb(0, 15 + bob, -7, 23 + stride);
      limb(1, 15 + bob, 7, 23 - stride);
      limb(0, 24 + bob, -3 - stride, 36);
      limb(0, 24 + bob, 3 + stride, 36);
    }
    ctx.restore();
  }

  function drawAttack() {
    if (player.attackTime <= 0) return;
    const box = attackBox();
    const front = player.attackFacing > 0 ? box.x : box.x + box.w;
    const tip = front + player.attackFacing * box.w;
    if (MAP.ui?.actionEffects) {
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.55 * player.attackTime / CONFIG.attackDuration;
      ctx.fillStyle = "#acdfea";
      ctx.beginPath();
      ctx.moveTo(front, box.y + 4);
      ctx.quadraticCurveTo(tip, box.y - 6, tip, box.y + box.h / 2);
      ctx.quadraticCurveTo(tip, box.y + box.h - 5, front, box.y + box.h - 2);
      const inner = tip - player.attackFacing * 14;
      ctx.quadraticCurveTo(inner, box.y + box.h - 8, inner, box.y + box.h / 2);
      ctx.quadraticCurveTo(inner, box.y + 4, front, box.y + 4);
      ctx.fill();
      ctx.restore();
      return;
    }
    ctx.strokeStyle = "#f0eee6";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(front, box.y + 3);
    ctx.lineTo(tip, box.y + box.h / 2);
    ctx.lineTo(front + player.attackFacing * 12, box.y + box.h - 3);
    ctx.stroke();
  }

  function drawActionEffects() {
    if (!actionEffects.length) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = 2;
    for (const effect of actionEffects) {
      const style = effectStyle[effect.kind];
      const age = (effectClock - effect.started) / CONFIG.actionEffectLifetime;
      ctx.globalAlpha = 1 - age;
      ctx.strokeStyle = style.color;
      ctx.beginPath();
      for (let i = 0; i < style.count; i++) {
        const angle = Math.PI * (1 + style.sweep * i / (style.count - 1));
        const dx = Math.cos(angle), dy = Math.sin(angle);
        const radius = 4 + style.travel * (1 - (1 - age) ** 2) * (0.65 + 0.18 * (i % 3));
        const tip = radius + style.streak * (1 - age);
        ctx.moveTo(effect.x + dx * radius, effect.y + dy * radius);
        ctx.lineTo(effect.x + dx * tip, effect.y + dy * tip);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBoss() {
    if (!boss || boss.hp <= 0) return;
    const warning = boss.state === "windup";
    const active = boss.state === "active";
    const color = warning ? "#e7bd74" : active ? "#e98181" : "#b79ac8";
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;
    if ((warning || active) && boss.move === "sweep") {
      const box = bossSweepBox();
      if (warning) { ctx.setLineDash([6, 5]); ctx.strokeRect(box.x, box.y, box.w, box.h); }
      else { ctx.globalAlpha = 0.4; ctx.fillRect(box.x, box.y, box.w, box.h); }
    }
    if (warning && boss.move === "charge") {
      const end = clamp(boss.x + boss.dir * CONFIG.bossChargeSpeed * CONFIG.bossChargeDuration,
        currentRoom().boss.arena.left, currentRoom().boss.arena.right - boss.w) + boss.w / 2;
      ctx.beginPath();
      ctx.moveTo(boss.x + boss.w / 2, currentRoom().boss.arena.floor - 12);
      ctx.lineTo(end, currentRoom().boss.arena.floor - 12);
      ctx.lineTo(end - boss.dir * 15, currentRoom().boss.arena.floor - 24);
      ctx.stroke();
    }
    if (warning && boss.move === "slam") {
      ctx.fillRect(currentRoom().boss.arena.left, currentRoom().boss.arena.floor - 6, currentRoom().boss.arena.right - currentRoom().boss.arena.left, 6);
      ctx.beginPath();
      ctx.moveTo(boss.x - 12, boss.y - 24);
      ctx.lineTo(boss.x + 8, boss.y + 15);
      ctx.moveTo(boss.x + boss.w + 12, boss.y - 24);
      ctx.lineTo(boss.x + boss.w - 8, boss.y + 15);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    ctx.fillStyle = boss.flash > 0 ? "#ffffff" : color;
    ctx.fillRect(Math.round(boss.x), boss.y, boss.w, boss.h);
    ctx.fillStyle = "#242a34";
    ctx.fillRect(boss.x + (boss.dir > 0 ? 36 : 10), boss.y + 15, 8, 8);
    if (warning) {
      ctx.fillStyle = color;
      ctx.font = "14px system-ui";
      ctx.textAlign = "center";
      ctx.fillText({ sweep: "横扫 · 起跳躲开", charge: "冲撞 · 跳过或拉开", slam: "震地 · 跳过贴地波" }[boss.move],
        boss.x + boss.w / 2, boss.y - (boss.move === "slam" ? 36 : 16));
    }
    ctx.restore();
  }

  function drawCombat() {
    for (const enemy of enemiesByRoom[roomId]) {
      if (enemy.hp <= 0 && !["scavenger", "shell-guard", "sludge-crab"].includes(enemy.kind)) continue;
      if (enemy.kind === "critter") {
        drawCritter(enemy);
        continue;
      }
      ctx.fillStyle = enemy.flash > 0 ? "#ffffff" : enemy.state === "withdrawn" ? "#68717c"
        : enemy.state === "windup" ? "#edba7c" : ["lunge", "active"].includes(enemy.state) ? "#ed8383" : "#c38792";
      ctx.fillRect(Math.round(enemy.x), Math.round(enemy.y), enemy.w, enemy.h);
      if (enemy.kind === "shell-guard") drawGuard(enemy);
      if (enemy.kind === "sludge-crab") drawSludgeCrab(enemy);
      if (enemy.kind === "scavenger") {
        ctx.strokeStyle = ctx.fillStyle;
        ctx.strokeRect(enemy.x + 4, enemy.y - 5, enemy.w - 8, 5);
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        const name = currentRoom().encounter.enemyName;
        const label = enemy.state === "withdrawn" ? (name ? "已退回" : "退回聚食处") : `${name || "食腐甲"} ${enemy.hp}`;
        ctx.fillText(label, enemy.x + enemy.w / 2, enemy.y - 14);
        if (enemy.state === "windup") {
          ctx.setLineDash([5, 4]);
          ctx.strokeRect(enemy.dir > 0 ? enemy.x + enemy.w : enemy.x - CONFIG.scavengerSpeed * CONFIG.scavengerLunge,
            enemy.floor - enemy.h, CONFIG.scavengerSpeed * CONFIG.scavengerLunge, enemy.h);
          ctx.setLineDash([]);
        }
      }
      ctx.fillStyle = "#242a34";
      ctx.fillRect(Math.round(enemy.x) + (enemy.dir > 0 ? 15 : 5), Math.round(enemy.y) + 7, 4, 4);
    }
    drawBoss();
    ctx.fillStyle = "#e98181";
    for (const wave of waves) ctx.fillRect(Math.round(wave.x), wave.y, wave.w, wave.h);
  }

  function drawCritter(enemy) {
    const x = Math.round(enemy.x), y = Math.round(enemy.y);
    const step = Math.floor(animationTime * 12) % 2;
    ctx.fillStyle = enemy.flash > 0 ? "#fff6ec" : "#d696a9";
    ctx.fillRect(x + 4, y, 15, 4);
    ctx.fillRect(x, y + 4, 24, 11);
    ctx.fillRect(x + 2, y + 15, 5, 3 + step * 2);
    ctx.fillRect(x + 16, y + 15, 5, 5 - step * 2);
    ctx.fillStyle = "#492f41";
    ctx.fillRect(x + (enemy.dir > 0 ? 17 : 4), y + 7, 3, 4);
  }

  function drawGuard(enemy) {
    ctx.strokeStyle = enemy.state === "withdrawn" ? "#68717c" : "#e7ca86";
    ctx.lineWidth = 4;
    const shellX = enemy.dir > 0 ? enemy.x + enemy.w - 8 : enemy.x + 4;
    ctx.strokeRect(shellX, enemy.y - 8, 8, enemy.h + 8);
    ctx.fillStyle = "#e7ca86";
    ctx.fillRect(enemy.dir > 0 ? enemy.x + 2 : enemy.x + enemy.w - 8, enemy.y + 15, 6, 18);
    ctx.font = "13px system-ui";ctx.textAlign = "center";
    const phase = enemy.state === "windup" ? (enemy.move === "claw" ? "钳击前摇" : "重壳前压")
      : enemy.state === "recovery" ? "扣带暴露" : "";
    ctx.fillText(enemy.state === "withdrawn" ? "负壳守卫 · 停战" : `负壳守卫 ${enemy.hp} · ${phase}`, enemy.x + enemy.w / 2, enemy.y - 20);
    if (["windup", "active"].includes(enemy.state)) {
      const box=guardThreatBox(enemy);
      ctx.strokeStyle=enemy.state === "windup" ? "#edba7c" : "#ed8383";
      ctx.setLineDash(enemy.state === "windup" ? [5,4] : []);
      ctx.lineWidth=2;ctx.strokeRect(box.x,box.y,box.w,box.h);ctx.setLineDash([]);
    }
  }

  function drawSludgeCrab(enemy) {
    ctx.strokeStyle=enemy.state === "windup" ? "#edba7c" : "#bbc2ca";ctx.lineWidth=3;
    ctx.strokeRect(enemy.x+5,enemy.y-6,enemy.w-10,12);
    if (enemy.state === "recovery" && enemy.x <= enemy.pitRight) {
      ctx.fillStyle="#e7ca86";ctx.fillRect(enemy.x+10,enemy.floor-9,enemy.w-20,7);
    }
    ctx.font="13px system-ui";ctx.textAlign="center";ctx.fillStyle="#d5dfeb";
    ctx.fillText(enemy.state === "withdrawn" ? "大甲退回低坑" : enemy.state === "dormant" ? "污絮"
      : `栖污大甲 ${enemy.hp}${enemy.state === "recovery" ? " · 抬甲收招" : ""}`, enemy.x+enemy.w/2,enemy.y-20);
    if (enemy.state === "windup") {
      const reach=CONFIG.sludgeLungeSpeed*CONFIG.sludgeLungeDuration;
      ctx.strokeStyle="#edba7c";ctx.setLineDash([5,4]);
      ctx.strokeRect(enemy.dir > 0 ? enemy.x+enemy.w : enemy.x-reach,enemy.y,reach,enemy.h);ctx.setLineDash([]);
    }
  }

  function drawCombatHud() {
    for (let i = 0; i < CONFIG.playerHealth; i++) {
      ctx.fillStyle = i < player.health ? "#e5aaa9" : "#454d5a";
      ctx.fillRect(16 + i * 23, 16, 17, 13);
    }
    if (!boss) return;
    ctx.font = "13px system-ui";
    ctx.textAlign = "center";
    if (progress.bossDefeated) {
      ctx.fillStyle = "#a8d6ae";
      ctx.fillText("守门人已击败", VIEW.width / 2, 27);
    } else if (boss.active) {
      const width = 360;
      ctx.fillStyle = "#454d5a";
      ctx.fillRect((VIEW.width - width) / 2, 16, width, 9);
      ctx.fillStyle = "#b79ac8";
      ctx.fillRect((VIEW.width - width) / 2, 16, width * boss.hp / CONFIG.bossHealth, 9);
      ctx.fillStyle = "#e7e9ed";
      const phase = { recovery: "硬直：可反击", windup: "前摇：准备躲避", active: "攻击中", idle: "准备出招" }[boss.state];
      ctx.fillText(`守门人 ${boss.hp} / ${CONFIG.bossHealth} · ${phase}`,
        VIEW.width / 2, 44);
    }
  }

  function itemAvailable(item) {
    return item.kind === "ability" ? !progress.abilities[item.id] : !progress.collected.has(item.id);
  }

  function drawRoomObjects() {
    const room = currentRoom();
    ctx.font = "14px system-ui";
    ctx.textAlign = "left";
    for (const [side, door] of Object.entries(room.doors)) {
      const left = side === "left";
      ctx.fillStyle = "#86aebc";
      ctx.fillRect(left ? 0 : room.width - 10, door.floor - 80, 10, 80);
      ctx.textAlign = left ? "left" : "right";
      ctx.fillText(left ? `← ${ROOMS[door.to].name}` : `${ROOMS[door.to].name} →`,
        left ? 18 : room.width - 18, door.floor - 98);
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "#b5becc";
    for (const sign of room.signs) {
      if (room.encounter && sign.y - camera.y < 105) continue;
      const text = progress.bossDefeated && sign.defeatedText ? sign.defeatedText : sign.text;
      ctx.fillText(text, sign.x, sign.y);
    }
    for (const [id, cp] of Object.entries(CHECKPOINTS)) {
      if (MAP.ui?.automaticCheckpoints && !room.encounter) continue;
      if (id === MAP.startCheckpoint || cp.room !== roomId) continue;
      ctx.fillStyle = progress.checkpoint === id ? "#a8d6ae" : "#6a9672";
      ctx.fillRect(cp.x - 12, cp.floor - 44, 24, 44);
      ctx.fillStyle = "#a8d6ae";
      ctx.fillText(progress.checkpoint === id ? "存档 / 回血" : "触碰存档", cp.x - 28, cp.floor - 56);
    }
    for (const item of room.items) {
      if (!itemAvailable(item)) continue;
      ctx.fillStyle = item.kind === "ability" ? "#b8dce6" : "#e7ca86";
      ctx.fillRect(item.x, item.y, item.w, item.h);
      if (item.label) {
        ctx.fillStyle = "#242a34";
        ctx.font = "bold 15px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(item.label, item.x + item.w / 2, item.y + 18);
        ctx.font = "14px system-ui";
        ctx.textAlign = "left";
      }
    }
    drawPortalsAndMarkers();
    drawInteractions();
  }

  function drawInteractions() {
    ctx.textAlign = "center";
    for (const item of [...(currentRoom().scenes || []), ...(currentRoom().barriers || [])]) {
      if (!conditionsMet(item)) continue;
      ctx.fillStyle=item.color || "#778391";ctx.fillRect(item.x,item.y,item.w,item.h);
      ctx.font="12px system-ui";ctx.fillStyle="#d5dfeb";
      if (item.y - camera.y > 105) ctx.fillText(item.label,item.x+item.w/2,item.y-12);
    }
    for (const item of currentRoom().interactions || []) {
      if (item.kind !== "exit" && !conditionsMet(item)) continue;
      const done = progress.flags.has(item.setsFlag);
      const exitPortals = item.kind === "exit" && currentRoom().portals?.filter(portal => touches(item, portal));
      if (done && exitPortals && exitPortals.some(conditionsMet)) continue;
      if (item.y - camera.y < 100) continue; // 避免高处观察点的框与章节目标重叠。
      ctx.strokeStyle = ctx.fillStyle = item.kind === "resident" ? "#b9d8ae" : done ? "#a0b4c5" : "#e7ca86";
      if (item.kind === "resident") {
        ctx.fillRect(item.x + 18, item.y + item.h - 32, 22, 32);
        ctx.fillRect(item.x + 3, item.y + item.h - 46, 9, 11);
      } else {
        ctx.strokeRect(item.x, item.y, item.w, item.h);
      }
      ctx.font = "13px system-ui";
      const chapter = currentRoom().chapterLabel || "第一章";
      ctx.fillText(done && item.kind === "exit" ? (exitPortals?.length ? `${chapter}完成 · ↑ 继续` : `${chapter}完成 · 可回访`) : item.label,
        item.x + item.w / 2, item.y - 14);
    }
  }

  function drawPortalsAndMarkers() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "14px system-ui";
    for (const portal of currentRoom().portals || []) {
      if (currentRoom().interactions?.some(item => item.kind === "exit" && touches(item, portal)
        && !progress.flags.has(item.setsFlag))) continue;
      const open = conditionsMet(portal);
      ctx.strokeStyle = ctx.fillStyle = open ? "#e7e9ed" : "#8793a4";
      ctx.lineWidth = 2;
      ctx.strokeRect(portal.x, portal.y, portal.w, portal.h);
      const center = clamp(portal.x + portal.w / 2, 125, currentRoom().width - 125);
      ctx.fillText(portal.label, center, portal.y - 28);
      const instruction = !open ? portal.lockedHint
        : portal.opensRoute && !progress.openedRoutes.has(portal.opensRoute) ? "↑ 打通捷径" : "↑ 进入";
      ctx.fillText(instruction, center, portal.y - 8);
    }
    for (const marker of currentRoom().markers || []) {
      ctx.strokeStyle = ctx.fillStyle = marker.kind === "主要对抗" ? "#e7e9ed" : "#a2abb9";
      ctx.setLineDash(marker.kind === "可选遭遇" ? [4, 4] : []);
      ctx.strokeRect(marker.x, marker.y, marker.w, marker.h);
      ctx.setLineDash([]);
      ctx.fillText(`${marker.kind}占位`, marker.x + marker.w / 2, marker.y - 30);
      ctx.fillText(marker.label, marker.x + marker.w / 2, marker.y - 10);
    }
    ctx.restore();
  }

  function draw() {
    if (!mapReady) return;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#242a34";
    ctx.fillRect(0, 0, VIEW.width, VIEW.height);
    ctx.save();
    const shake = CONFIG.shakeDuration > 0 ? shakeTime / CONFIG.shakeDuration * CONFIG.shakeStrength : 0;
    ctx.translate(-Math.round(camera.x) + Math.round(Math.sin(effectClock * 190) * shake),
      -Math.round(camera.y) + Math.round(Math.cos(effectClock * 157) * shake));
    ctx.fillStyle = MAP.ui?.platformColor || "#687587";
    for (const p of currentRoom().platforms) {
      if (p.x + p.w < camera.x || p.x > camera.x + VIEW.width
        || p.y + p.h < camera.y || p.y > camera.y + VIEW.height) continue;
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    drawRoomObjects();
    drawCombat();
    drawPlayer();
    drawAttack();
    drawActionEffects();
    ctx.restore();
    ctx.fillStyle = "#b5becc";
    ctx.font = "14px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`${currentRoom().name} · 已探索 ${progress.visited.size} / ${Object.keys(ROOMS).length}`, 16, 54);
    ctx.textAlign = "right";
    if (COLLECTIBLE_IDS.length) ctx.fillText(`收集 ${progress.collected.size} / ${COLLECTIBLE_IDS.length}`, VIEW.width - 16, 26);
    drawCombatHud();
    if (currentRoom().encounter) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#d5dfeb";
      ctx.fillText(`目标：${roomHint()}`, 16, 78);
    }
    if (noticeTime > 0) {
      ctx.font = "14px system-ui";
      const lines = [""];
      for (const char of notice) {
        if (ctx.measureText(lines[lines.length - 1] + char).width > VIEW.width - 64) lines.push("");
        lines[lines.length - 1] += char;
      }
      const width = Math.min(VIEW.width - 24, Math.max(...lines.map(line => ctx.measureText(line).width)) + 24);
      const height = 12 + lines.length * 20;
      ctx.fillStyle = "#171b22";
      ctx.fillRect((VIEW.width - width) / 2, VIEW.height - height - 12, width, height);
      ctx.fillStyle = "#e7e9ed";
      ctx.textAlign = "center";
      lines.forEach((line, i) => ctx.fillText(line, VIEW.width / 2, VIEW.height - height + 8 + i * 20));
    }
    if (paused) {
      ctx.fillStyle = "#242a34";
      ctx.fillRect(VIEW.width / 2 - 150, VIEW.height / 2 - 24, 300, 48);
      ctx.fillStyle = "#f0eee6";
      ctx.font = "16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("已暂停 · 点击游戏继续", VIEW.width / 2, VIEW.height / 2 + 6);
    }
    document.getElementById("room-name").textContent = currentRoom().name;
    document.getElementById("jump-status").textContent = !progress.abilities.doubleJump
      ? "二段跳未解锁" : player.extraJumpUsed ? "二段跳已使用" : "二段跳就绪";
    dashStatus.textContent = !progress.abilities.dash ? "冲刺未解锁" : player.cooldown > 0
      ? `冲刺冷却 ${player.cooldown.toFixed(1)} 秒` : "冲刺就绪";
    document.getElementById("collection-status").textContent = `收集 ${progress.collected.size} / ${COLLECTIBLE_IDS.length}`;
  }

  function mapElement(parent, tag, attrs = {}, text = "") {
    const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    if (text) element.textContent = text;
    parent.append(element);
    return element;
  }

  function mapConnectionPoints(from, to, portal) {
    const a = { x: from.position.x * 250 + 40, y: from.position.y * 180 + 40 };
    const b = { x: to.position.x * 250 + 40, y: to.position.y * 180 + 40 };
    if (a.x !== b.x && a.y !== b.y) {
      if (portal.kind === "return") {
        const midY = (a.y + 110 + b.y) / 2;
        return [[a.x + 45, a.y + 110], [a.x + 45, midY], [b.x + 145, midY], [b.x + 145, b.y]];
      }
      const left = b.x < a.x;
      const start = [a.x + (left ? 0 : 190), a.y + 28];
      const end = [b.x + (left ? 190 : 0), b.y + 82];
      const midX = (start[0] + end[0]) / 2;
      return [start, [midX, start[1]], [midX, end[1]], end];
    }
    if (a.x === b.x) return b.y < a.y
      ? [[a.x + 95, a.y], [b.x + 95, b.y + 110]]
      : [[a.x + 95, a.y + 110], [b.x + 95, b.y]];
    return b.x < a.x
      ? [[a.x, a.y + 55], [b.x + 190, b.y + 55]]
      : [[a.x + 190, a.y + 55], [b.x, b.y + 55]];
  }

  function drawMapConnection(svg, from, portal) {
    const points = mapConnectionPoints(from, ROOMS[portal.to], portal);
    const shortcut = portal.kind === "shortcut";
    const open = shortcut ? progress.openedRoutes.has(portal.opensRoute) : conditionsMet(portal);
    const color = portal.kind === "return" ? open ? "#c5a4de" : "#776584"
      : shortcut ? open ? "#8ed0ff" : "#66717f" : "#8594a6";
    mapElement(svg, "polyline", { points: points.map(p => p.join(",")).join(" "), fill: "none",
      stroke: color, "stroke-width": 2, "stroke-dasharray": open ? "none" : "6 5",
      "marker-end": `url(#map-arrow-${portal.kind === "return" ? "return" : shortcut ? "shortcut" : "main"})`,
      "data-kind": portal.kind, "data-to": portal.to, "data-open": open });
    if (shortcut) {
      const middle = points.length === 4
        ? [points[1][0], (points[1][1] + points[2][1]) / 2]
        : [(points[0][0] + points[1][0]) / 2, (points[0][1] + points[1][1]) / 2];
      const width = Math.max(80, (portal.opensRoute.length + 4) * 15);
      mapElement(svg, "rect", { x: middle[0] - width / 2, y: middle[1] - 13, width, height: 26, fill: "#202630" });
      mapElement(svg, "text", { x: middle[0], y: middle[1] + 5, fill: color, "font-size": 15, "text-anchor": "middle",
        "data-shortcut": portal.opensRoute }, `${portal.opensRoute} ${open ? "已打通" : "未打通"}`);
    }
  }

  function drawMapRoom(svg, id, room) {
    const here = id === roomId, visited = progress.visited.has(id);
    const x = room.position.x * 250 + 40, y = room.position.y * 180 + 40;
    const group = mapElement(svg, "g", { "data-room": id, "data-current": here, "aria-label": `${room.name}${here ? "，你在这里" : visited ? "，已到达" : "，未到达"}` });
    mapElement(group, "title", {}, `${room.name} · ${here ? "你在这里" : visited ? "已到达" : "未到达"}`);
    mapElement(group, "rect", { x, y, width: 190, height: 110, rx: 7,
      fill: here ? "#243f53" : visited ? "#303946" : "#242b35", stroke: here ? "#62baff" : visited ? "#b1bdcc" : "#5f6b7b",
      "stroke-width": here ? 3 : 1.5, "stroke-dasharray": visited ? "none" : "5 4" });
    const [chapter, name = room.name] = room.name.split(" · ");
    const [organ, ...rest] = name.split("·");
    const textAttrs = { x: x + 95, "text-anchor": "middle", fill: here ? "#b9e4ff" : visited ? "#e7e9ed" : "#a2abb9", "font-size": 17 };
    mapElement(group, "text", { ...textAttrs, y: y + 29 }, `${chapter} · ${organ}`);
    mapElement(group, "text", { ...textAttrs, y: y + 55 }, room.mapLabel || rest.join("·"));
    mapElement(group, "text", { ...textAttrs, y: y + 85, "font-size": 14, "font-weight": here ? 600 : 400 }, here ? "你在这里" : visited ? "已到达" : "未到达");
  }

  function renderWorldMap() {
    const rooms = Object.values(ROOMS);
    const width = Math.max(...rooms.map(r => r.position.x)) * 250 + 270;
    const height = Math.max(...rooms.map(r => r.position.y)) * 180 + 190;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `完整地图，当前位于${currentRoom().name}，已到达${progress.visited.size}个房间`);
    const defs = mapElement(svg, "defs");
    for (const [name, color] of [["main", "#8594a6"], ["return", "#c5a4de"], ["shortcut", "#8ed0ff"]]) {
      const marker = mapElement(defs, "marker", { id: `map-arrow-${name}`, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto" });
      mapElement(marker, "path", { d: "M 1 1 L 7 4 L 1 7", fill: "none", stroke: color, "stroke-width": 1.4 });
    }
    for (const room of rooms) for (const portal of room.portals || []) {
      if (["advance", "return"].includes(portal.kind) || portal.opensRoute) drawMapConnection(svg, room, portal);
    }
    for (const [id, room] of Object.entries(ROOMS)) drawMapRoom(svg, id, room);
    document.getElementById("map-graph").replaceChildren(svg);
    document.getElementById("map-location").textContent = `你在这里：${currentRoom().name}　已到达 ${progress.visited.size} / ${rooms.length}`;
  }

  function openWorldMap() {
    if (!mapReady || !MAP.ui?.showMap || mapOpen) return;
    pausedBeforeMap = paused;
    pause();
    mapOpen = true;
    renderWorldMap();
    document.getElementById("world-map").showModal();
    const graph = document.getElementById("map-graph");
    graph.focus();
    const current = graph.querySelector('[data-current="true"]').getBoundingClientRect();
    const viewport = graph.getBoundingClientRect();
    graph.scrollLeft += current.left + current.width / 2 - viewport.left - graph.clientWidth / 2;
  }

  function closeWorldMap() {
    if (!mapOpen) return;
    mapOpen = false;
    document.getElementById("world-map").close();
    paused = pausedBeforeMap;
    canvas.focus();
    draw();
  }

  document.getElementById("open-map").addEventListener("click", openWorldMap);
  document.getElementById("close-map").addEventListener("click", closeWorldMap);
  document.getElementById("world-map").addEventListener("cancel", event => { event.preventDefault(); closeWorldMap(); });

  const gameKeys = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "KeyA", "KeyD", "Space", "ShiftLeft", "ShiftRight", "KeyJ", "KeyR", "KeyF"]);
  window.addEventListener("keydown", event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (mapOpen || (event.code === "KeyM" && mapReady && MAP.ui?.showMap)) {
      if (!event.repeat && (event.code === "KeyM" || event.code === "Escape")) {
        event.preventDefault();
        if (mapOpen) closeWorldMap(); else openWorldMap();
      }
      return;
    }
    if (!mapReady || !gameKeys.has(event.code) || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.code === "ArrowUp" && !currentRoom().portals?.length && !currentRoom().interactions?.length) return;
    event.preventDefault();
    paused = false;
    if (event.repeat || keys.has(event.code)) return;
    keys.add(event.code);
    if (event.code === "Space") jumpBuffer = CONFIG.jumpBufferTime;
    if (event.code === "ShiftLeft" || event.code === "ShiftRight") dashRequested = true;
    if (event.code === "KeyJ") attackRequested = true;
    if (event.code === "ArrowUp") portalRequested = true;
    if (event.code === "KeyR") {
      reset();
      notify(`已返回${CHECKPOINTS[progress.checkpoint].name}`);
    }
    if (event.code === "KeyF") {
      const operation = document.fullscreenElement
        ? document.exitFullscreen?.() : canvas.requestFullscreen?.();
      if (operation) operation.catch(() => {});
    }
  });
  window.addEventListener("keyup", event => keys.delete(event.code));

  function pause() {
    keys.clear();
    jumpBuffer = 0;
    dashRequested = false;
    attackRequested = false;
    portalRequested = false;
    paused = true;
    accumulator = 0;
    draw();
  }
  window.addEventListener("blur", pause);
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  canvas.addEventListener("pointerdown", () => { paused = false; canvas.focus(); });
  document.getElementById("restart").addEventListener("click", () => {
    paused = false;
    reset();
    notify(`已返回${CHECKPOINTS[progress.checkpoint].name}`);
    canvas.focus();
  });
  document.getElementById("new-game").addEventListener("click", () => {
    newGame();
    canvas.focus();
  });

  function frame(now) {
    const elapsed = Math.min((now - (lastFrame || now)) / 1000, 0.05);
    lastFrame = now;
    if (!manualTime && !paused) {
      accumulator += elapsed;
      while (accumulator >= STEP) {
        accumulator -= STEP;
        update(STEP);
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // 自动化验证入口：地图加载完成后沿用原来的固定步长。
  window.advanceTime = ms => {
    if (!mapReady) return;
    manualTime = true;
    const steps = Math.max(0, Math.round(ms / (STEP * 1000)));
    for (let i = 0; i < steps; i++) if (!paused) update(STEP);
    draw();
  };
  window.render_game_to_text = () => {
    if (!mapReady) return JSON.stringify({ mode: mapError ? "map-error" : "loading", error: mapError });
    return JSON.stringify({
      coordinates: "世界坐标；左上原点；x 向右，y 向下；单位 px，时间 s",
      mode: paused ? "paused" : "playing",
      player: { ...player, width: BODY.width, height: BODY.height,
        pose: player.dashTime > 0 ? "dash" : !player.grounded ? "jump"
          : Math.abs(player.vx) > 15 ? "run" : "idle" },
      jumpBuffer,
      camera: { ...camera, width: VIEW.width, height: VIEW.height },
      room: { id: roomId, name: currentRoom().name, width: currentRoom().width,
        height: currentRoom().height, doors: currentRoom().doors },
      mapId: MAP.id,
      mapOpen,
      portals: (currentRoom().portals || []).map(portal => ({ ...portal, open: conditionsMet(portal) })),
      markers: currentRoom().markers || [],
      ...(currentRoom().barriers ? { barriers: currentRoom().barriers.filter(conditionsMet) } : {}),
      ...(currentRoom().scenes ? { scenes: currentRoom().scenes.filter(conditionsMet) } : {}),
      ...(currentRoom().transitions ? { storyTimers: { ...storyTimers } } : {}),
      openedRoutes: [...progress.openedRoutes],
      ...(MAP.storyFlags ? { flags: [...progress.flags], objective: roomHint(),
        interactions: (currentRoom().interactions || []).filter(item => conditionsMet(item) || item.kind === "exit")
          .map(item => ({ ...item, done: progress.flags.has(item.setsFlag) })),
        encounter: currentRoom().encounter ? { id: currentRoom().encounter.id,
          cleared: progress.flags.has(currentRoom().encounter.flag) } : null,
        withdrawnEnemies: enemiesByRoom[roomId].filter(enemy => enemy.state === "withdrawn") } : {}),
      abilities: { ...progress.abilities },
      ...(MAP.ui?.actionEffects ? { effects: actionEffects.map(({ kind, x, y }) => ({ kind, x, y })) } : {}),
      checkpoint: { id: progress.checkpoint, ...CHECKPOINTS[progress.checkpoint] },
      collected: [...progress.collected], totalCollectibles: COLLECTIBLE_IDS.length,
      visited: [...progress.visited], deaths, notice: noticeTime > 0 ? notice : "",
      combat: { hitStop: hitStopTime, shakeTime, attackSerial,
        attackBox: player.attackTime > 0 ? attackBox() : null },
      enemies: enemiesByRoom[roomId].filter(enemy => enemy.hp > 0 && enemy.state !== "withdrawn").map(enemy => ({ ...enemy })),
      boss: boss ? { ...boss } : null,
      bossDefeated: progress.bossDefeated, waves: waves.map(wave => ({ ...wave })),
      visibleItems: currentRoom().items.filter(itemAvailable).filter(p => p.x + p.w >= camera.x
        && p.x <= camera.x + VIEW.width && p.y + p.h >= camera.y && p.y <= camera.y + VIEW.height),
      visiblePlatforms: currentRoom().platforms.filter(p => p.x + p.w >= camera.x
        && p.x <= camera.x + VIEW.width && p.y + p.h >= camera.y
        && p.y <= camera.y + VIEW.height),
    });
  };

  startMapLoad();
  </script>
</body>
</html>
