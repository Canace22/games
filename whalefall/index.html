<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07171f">
  <title>壳灯微光 · 鲸腹遗城</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root { color-scheme: dark; --ink: #e6ddc7; --quiet: #7d979e; --line: #29404a; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 26%, #142f3a 0, #091b24 45%, #06131b 90%); color: var(--ink); font: 13px/1.7 system-ui, -apple-system, sans-serif; }
    main { width: min(1180px, calc(100% - 64px)); margin: 0 auto; padding: 30px 0 24px; }
    header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 17px; }
    .brand { font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: 20px; letter-spacing: 5px; }
    .brand small { display: block; margin-top: 1px; color: var(--quiet); font: 8px/1.5 system-ui; letter-spacing: 3.7px; }
    .edition { color: #9cafae; font-size: 10px; letter-spacing: 2px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 26px 0 20px; }
    .eyebrow { margin: 0 0 6px; color: #beaa7d; font-size: 9px; letter-spacing: 3px; }
    h1 { font: 30px/1.3 "Songti SC", "Noto Serif CJK SC", serif; letter-spacing: 3px; margin: 0; }
    #objective { color: #94a9ab; margin: 9px 0 0; font-size: 12px; }
    .actions { display: flex; gap: 8px; padding-bottom: 3px; }
    button, .text-link { color: #b7c7c6; font: inherit; font-size: 11px; }
    button { padding: 7px 12px; background: #122831; border: 1px solid #304853; border-radius: 3px; cursor: pointer; }
    button:hover { color: #f1e3c3; border-color: #9b8d6c; }
    button:focus-visible, a:focus-visible { outline: 2px solid #d7c392; outline-offset: 4px; }
    .stage { position: relative; border: 1px solid #36515c; border-radius: 4px; overflow: hidden; box-shadow: 0 24px 70px #02090d80; background: #081e29; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16/9; outline: none; }
    canvas:focus-visible { outline: 1px solid #b3c3b1; outline-offset: -2px; }
    canvas:fullscreen { width: 100vw; height: 100vh; object-fit: contain; background: #06131b; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; background: #0b232e; }
    #loading strong { font: 25px "Songti SC", serif; letter-spacing: 5px; }
    #load-detail { color: #9bb2b7; font-size: 12px; }
    .under { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); padding: 15px 0; }
    .keys { display: flex; flex-wrap: wrap; gap: 8px 20px; color: #9cb0b4; font-size: 11px; }
    kbd { display: inline-block; min-width: 22px; color: #d9d5c1; margin-right: 4px; font: 10px system-ui; }
    .location { white-space: nowrap; color: #bcae8b; font-size: 11px; letter-spacing: 1px; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-top: 16px; color: #6f8b95; font-size: 10px; }
    .status { display: flex; gap: 14px; color: #8aa5ab; }
    .text-link { color: #839ca5; text-underline-offset: 3px; font-size: 10px; }
    #save-status { font-size: 10px; color: #6f8b95; margin: 8px 0 0; }
    @media (max-width: 700px) {
      main { width: calc(100% - 24px); padding-top: 18px; }
      .intro { display: block; padding-top: 20px; }
      .actions { margin-top: 16px; }
      h1 { font-size: 25px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .under { align-items: flex-start; }
      .keys { gap: 5px 12px; }
      .status { gap: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">鲸腹遗城<small>WHALEFALL · LIFE WITHIN</small></div>
      <div class="edition">可玩切片　/　01</div>
    </header>
    <section class="intro">
      <div>
        <p class="eyebrow">A SMALL LIGHT IN THE DEEP</p>
        <h1>壳灯微光</h1>
        <p id="objective">循着微光深入须林，寻找越过断口的力量。</p>
      </div>
      <div class="actions">
        <button id="restart" type="button">返回壳灯 <span aria-hidden="true">↶</span></button>
        <button id="new-game" type="button">重新开始</button>
      </div>
    </section>
    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="壳灯微光，横版探索游戏。AD移动，空格跳跃，J鸣击；获得能力后可二段跳、Shift冲刺。R回到存档，F全屏。"></canvas>
      <div id="loading" role="status" aria-live="polite"><strong>壳灯微光</strong><span id="load-detail">正在唤醒深海里的微光…</span><button id="retry" hidden onclick="location.reload()">重新载入</button></div>
    </div>
    <div class="under">
      <div class="keys">
        <span><kbd>A D</kbd>移动</span><span><kbd>Space</kbd>按住跳跃 / 二段跳</span>
        <span><kbd>J</kbd>鸣击</span><span><kbd>Shift</kbd>贴流冲</span><span><kbd>R</kbd>回壳灯</span><span><kbd>F</kbd>全屏</span>
      </div>
      <span class="location" id="room-name">壳灯浅滩</span>
    </div>
    <footer>
      <div class="status"><span id="jump-status">浮升待发现</span><span id="dash-status">贴流冲待发现</span><span id="collection-status">记忆 0 / 2</span></div>
      <span>桌面键盘试玩　·　<a class="text-link" href="../prototype/">原型对照 ↗</a></span>
    </footer>
    <p id="save-status">走近壳灯自动存档并回血。进度保存在本机浏览器；离开页面后可继续旅程。</p>
  </main>
  <script src="assets.js"></script>
  <script src="game.js"></script>
</body>
</html>
